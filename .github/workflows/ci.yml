name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t india-hotels-mcp:ci .
      - name: Start container and check health
        run: |
          docker run -d --name mcp -p 127.0.0.1:3001:3001 india-hotels-mcp:ci
          for i in $(seq 1 30); do curl -sf localhost:3001/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1
